{% extends "base.html" %}

{% block title %}Initial Setup - Nginx Analytics{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2>Initial Setup</h2>
        <p style="margin-bottom: 1.5rem; color: #666; font-size: 0.9rem;">Please define your permanent administrator password to complete setup.</p>

        <!-- Error Block -->
        {% if let Some(err) = error %}
        <div class="error-banner">
            {{ err }}
        </div>
        {% endif %}

        <form action="/setup" method="POST" class="login-form form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn-primary" style="padding: 0.75em;">Save and Enter</button>
        </form>
    </div>
</div>
{% endblock %}
